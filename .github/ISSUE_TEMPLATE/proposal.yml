name: Proposal
description: Compartilhar uma ideia
labels: ["Proposal"]
body:
  - type: markdown
    attributes:
      value: "Bem-vindo! Todos podem contribuir. Novas tarefas aguardam aprovação do Revisor."
  - type: textarea
    id: proposta
    attributes:
      label: "Qual é sua ideia?"
      description: "Conte com suas palavras."
    validations:
      required: true
  - type: textarea
    id: apoio
    attributes:
      label: "Materiais ou sugestões (opcional)"
      description: "Links, exemplos ou como você gostaria de ajudar."

