# Confere todo PR para a main: app (testes, lint, validadores de conteúdo e APK de debug), SQL do Supabase num Postgres
# local e o preview-harness (integração, social, migração e acessibilidade). Roda também a cada push na main, o que
# mantém o cache do Gradle em dia para os PRs.
#
# Na proteção da main, o único check obrigatório é "CI ok": ele espera os outros e passa quando um job foi pulado
# porque o PR não mexe no que ele confere (ex.: PR só de docs). Ver CONTRIBUTING.md, "Configuração única do dono".
#
# Sem secrets e com permissão só de leitura: PRs de forks rodam o mesmo workflow com segurança. Nunca troque por
# pull_request_target. Assinatura e tools/build_apk.sh ficam fora daqui (a chave fica só com o dono).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mudancas:
    name: O que mudou
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filtro.outputs.app }}
      sql: ${{ steps.filtro.outputs.sql }}
      harness: ${{ steps.filtro.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
      - id: filtro
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build: &build
              - "gradle/**"
              - "gradlew"
              - "*.gradle.kts"
              - "gradle.properties"
              - ".github/workflows/ci.yml"
            app:
              - *build
              - "app/**"
              - "content/provas/**"
              - "tools/*.py"
            sql:
              - "supabase/**"
              - "tools/sql-tests/**"
              - ".github/workflows/ci.yml"
            harness:
              - *build
              - "app/src/main/**"
              - "app/schemas/**"
              - "tools/preview-harness/**"

  app:
    name: App (check + APK de debug)
    needs: mudancas
    if: needs.mudancas.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check assembleDebug --stacktrace
      - name: Relatórios de teste e lint
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-app
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  sql:
    name: SQL do Supabase
    needs: mudancas
    if: needs.mudancas.outputs.sql == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # O runner já traz o servidor PostgreSQL; o run.sh sobe um banco próprio e descartável com initdb/pg_ctl.
      - run: ls -d /usr/lib/postgresql/*/bin
      - run: tools/sql-tests/run.sh

  harness:
    name: Preview-harness (integração e acessibilidade)
    needs: mudancas
    if: needs.mudancas.outputs.harness == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -p tools/preview-harness :shot:testDebugUnitTest --stacktrace
      - name: Telas renderizadas (para conferir o visual sem emulador)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telas
          path: tools/preview-harness/shot/build/shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-harness
          path: tools/preview-harness/shot/build/reports/
          retention-days: 7

  ci-ok:
    name: CI ok
    needs: [mudancas, app, sql, harness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs passaram ou foram pulados
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            case "$r" in success|skipped) ;; *) echo "Algum job falhou ou foi cancelado."; exit 1 ;; esac
          done
