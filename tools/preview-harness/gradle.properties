# Este é um build Gradle separado (./gradlew -p tools/preview-harness ...): ele NÃO lê o gradle.properties da raiz.
# Sem isto o daemon fica com o heap padrão (512 MB) e estoura ao transformar os jars do Robolectric num cache vazio
# (como na CI). Mantenha em linha com o gradle.properties da raiz.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
